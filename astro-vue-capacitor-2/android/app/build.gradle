apply plugin: 'com.android.application'

// Version derived from git so every build points at a distinct commit:
// commit count -> versionCode (monotonic), short hash -> readable versionName.
// Falls back safely outside a git checkout (e.g. a source tarball / CI shallow).
def gitVersion = { ->
    try {
        def count = 'git rev-list --count HEAD'.execute(null, rootDir).text.trim()
        def hash = 'git rev-parse --short HEAD'.execute(null, rootDir).text.trim()
        return [code: count.toInteger(), name: "2.0.${count} (${hash})".toString()]
    } catch (ignored) {
        return [code: 1, name: "2.0.0-dev".toString()]
    }
}
def appVersion = gitVersion()
// A release (CI tag build / scripts/release.sh) pins the human version, e.g. "2.1.0";
// versionCode stays the commit count so every release installs over the last one.
def releaseVersion = System.getenv('RASTRO_VERSION_NAME')
if (releaseVersion) appVersion.name = releaseVersion

// Release signing. CI passes the keystore through env vars (GitHub secrets);
// locally, an untracked android/keystore.properties works too. Without either,
// the release build is left unsigned (Gradle still builds it, it just won't install).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String env, String prop -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
def releaseStoreFile = signingValue('RASTRO_KEYSTORE_FILE', 'storeFile')

android {
    namespace = "com.rastro.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rastro.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.code
        versionName appVersion.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = signingValue('RASTRO_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias = signingValue('RASTRO_KEY_ALIAS', 'keyAlias')
                keyPassword = signingValue('RASTRO_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) signingConfig = signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
