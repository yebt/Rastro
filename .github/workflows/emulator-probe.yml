# TEMPORARY — runs the debug APK on an Android emulator and probes the vector
# basemap inside the app's real WebView (errors + screenshot).
name: Emulator probe
on:
  push:
    branches: [ccr-781009ae-4rw9b1]
    paths: [".github/workflows/emulator-probe.yml"]
permissions:
  contents: write
defaults:
  run:
    working-directory: astro-vue-capacitor-2
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-vue-capacitor-2/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Probe script
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app.apk
          ML=$(cd dist && ls _astro/maplibre-gl.*.js)
          echo "ML=/$ML" >> "$GITHUB_ENV"
          cat > probe.mjs <<'JS'
          // Raw CDP over WebSocket (Playwright can't attach to an Android WebView).
          import { writeFileSync } from "node:fs";
          const targets = await (await fetch("http://127.0.0.1:9222/json")).json();
          const page = targets.find((t) => t.type === "page" && t.url.startsWith("https://localhost")) ?? targets.find((t) => t.type === "page");
          console.log("PAGE", page?.url);
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((r) => ws.addEventListener("open", r));
          let id = 0;
          const pending = new Map();
          ws.addEventListener("message", (ev) => {
            const m = JSON.parse(ev.data);
            if (m.id && pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); }
            if (m.method === "Runtime.consoleAPICalled") console.log("CONSOLE", m.params.type, m.params.args.map((a) => a.value ?? a.description).join(" ").slice(0, 300));
            if (m.method === "Runtime.exceptionThrown") console.log("EXCEPTION", m.params.exceptionDetails.text, m.params.exceptionDetails.exception?.description?.slice(0, 300));
          });
          const send = (method, params = {}) => new Promise((r) => { const i = ++id; pending.set(i, r); ws.send(JSON.stringify({ id: i, method, params })); });
          await send("Runtime.enable");
          const ev = async (expr) => {
            const r = await send("Runtime.evaluate", { expression: expr, awaitPromise: true, returnByValue: true, timeout: 60000 });
            if (r.result?.exceptionDetails) console.log("EVAL EXCEPTION", JSON.stringify(r.result.exceptionDetails).slice(0, 600));
            return r.result?.result?.value;
          };
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          // 0) Skip the first-run setup and let the app create its own DB (schema + indexes).
          console.log("SETUP", await ev(`(() => { localStorage.setItem("rastro.setupDone", "1"); return "ok"; })()`));
          await send("Page.reload");
          await sleep(8000);
          await send("Runtime.enable");
          // 1) Seed a finished jog (a ~1 km loop in Bogotá) straight into the app's IndexedDB.
          console.log("SEED", await ev(`(async () => {
            const t0 = Date.now() - 3600e3; const pts = [];
            for (let i = 0; i <= 120; i++) { const a = (i / 120) * 2 * Math.PI;
              pts.push({ t: t0 + i * 5000, lat: 4.638 + 0.0015 * Math.sin(a), lng: -74.076 + 0.002 * Math.cos(a), alt: null, acc: 4, altAcc: null, spd: 2.5, st: i * 8 }); }
            const act = { id: "probe-1", schemaVersion: 1, kind: "move", type: "jog", startedAt: t0, endedAt: t0 + 600e3, points: pts, steps: 960, movingMs: 600e3, pauses: 0 };
            const db = await new Promise((res, rej) => { const r = indexedDB.open("rastro"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
            await new Promise((res, rej) => { const tx = db.transaction("activities", "readwrite"); tx.objectStore("activities").put(act); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
            db.close(); return "ok, basemap=" + localStorage.getItem("rastro.basemap");
          })()`));
          await send("Page.reload");
          await sleep(8000);
          await send("Runtime.enable");
          // 2) Navigate like a user: Info tab → Historial → first activity.
          const click = (sel, text) => ev(`(() => { const el = [...document.querySelectorAll(${JSON.stringify(sel)})].find((e) => e.textContent.includes(${JSON.stringify(text)})); if (!el) return "missing " + ${JSON.stringify(text)}; (el.closest("button") || el).click(); return "clicked " + ${JSON.stringify(text)}; })()`);
          console.log("NAV", await click(".tab-label", "Info"));
          await sleep(1500);
          console.log("NAV", await click("button, [role=button], .row", "Historial"));
          await sleep(1500);
          console.log("NAV", await ev(`(() => { const r = document.querySelector("button.row"); if (!r) return "no rows"; r.click(); return "opened " + r.textContent.trim().slice(0, 40); })()`));
          for (const t of [2, 5, 10, 15, 20]) {
            await sleep(t === 2 ? 2000 : t === 5 ? 3000 : 5000);
            const alive = await Promise.race([ev("1+1"), sleep(4000).then(() => "TIMEOUT")]);
            console.log("ALIVE@" + t + "s", alive);
            if (alive === "TIMEOUT") break;
          }
          ws.addEventListener("close", () => console.log("WS CLOSED"));
          console.log("STATE", JSON.stringify(await ev(`(() => ({
            glLayer: !!document.querySelector(".leaflet-gl-layer"),
            glCanvas: document.querySelectorAll(".leaflet-gl-layer canvas, canvas.maplibregl-canvas").length,
            rasterTiles: document.querySelectorAll(".leaflet-tile").length,
            route: document.querySelectorAll("path.leaflet-interactive").length,
            mapSize: (() => { const m = document.querySelector(".leaflet-container"); return m ? m.clientWidth + "x" + m.clientHeight : null; })(),
            glSize: (() => { const c = document.querySelector(".leaflet-gl-layer"); return c ? c.style.width + "x" + c.style.height + " " + c.style.transform : null; })(),
          }))()`)));
          ws.close();
          JS
          cat > emu.sh <<'SH'
          set -x
          adb install -r app.apk
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACTIVITY_RECOGNITION POST_NOTIFICATIONS; do adb shell pm grant com.rastro.app android.permission.$p || true; done
          adb shell am start -n com.rastro.app/.MainActivity
          sleep 25
          PID=$(adb shell pidof com.rastro.app | tr -d '\r')
          echo "PID=$PID"
          adb shell cat /proc/net/unix | grep -o 'webview_devtools_remote_[0-9]*' | sort -u
          adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
          curl -s http://127.0.0.1:9222/json/version || true
          adb shell dumpsys package com.google.android.webview | grep versionName | head -2
          timeout 180 node probe.mjs || echo "probe failed"
          echo "=== app process after probe:"; adb shell pidof com.rastro.app || echo "APP DEAD"
          adb logcat -d | grep -iE "fatal|crash|render|gpu|gles|died|AndroidRuntime|libc|tombstone|oom|lowmemory|Killing|signal|abort|webgl|context lost" | grep -v "Handling local" | tail -80
          SH
          chmod +x emu.sh
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: astro-vue-capacitor-2
          script: ./emu.sh
      - name: Commit screenshot
        if: always()
        run: |
          [ -f probe.png ] || exit 0
          mkdir -p ../map-previews && cp probe.png ../map-previews/emulator-probe.png
          cd .. && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-previews && git commit -m "chore: emulator probe screenshot (temporary)" && git pull --rebase -q && git push
