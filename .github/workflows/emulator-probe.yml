# TEMPORARY — runs the debug APK on an Android emulator and probes the vector
# basemap inside the app's real WebView (errors + screenshot).
name: Emulator probe
on:
  push:
    branches: [ccr-781009ae-4rw9b1]
    paths: [".github/workflows/emulator-probe.yml"]
permissions:
  contents: write
defaults:
  run:
    working-directory: astro-vue-capacitor-2
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-vue-capacitor-2/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Probe script
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app.apk
          ML=$(cd dist && ls _astro/maplibre-gl.*.js)
          echo "ML=/$ML" >> "$GITHUB_ENV"
          cat > probe.mjs <<'JS'
          // Raw CDP over WebSocket (Playwright can't attach to an Android WebView).
          import { writeFileSync } from "node:fs";
          const targets = await (await fetch("http://127.0.0.1:9222/json")).json();
          const page = targets.find((t) => t.type === "page" && t.url.startsWith("https://localhost")) ?? targets.find((t) => t.type === "page");
          console.log("PAGE", page?.url);
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((r) => ws.addEventListener("open", r));
          let id = 0;
          const pending = new Map();
          ws.addEventListener("message", (ev) => {
            const m = JSON.parse(ev.data);
            if (m.id && pending.has(m.id)) { pending.get(m.id)(m); pending.delete(m.id); }
            if (m.method === "Runtime.consoleAPICalled") console.log("CONSOLE", m.params.type, m.params.args.map((a) => a.value ?? a.description).join(" ").slice(0, 300));
            if (m.method === "Runtime.exceptionThrown") console.log("EXCEPTION", m.params.exceptionDetails.text, m.params.exceptionDetails.exception?.description?.slice(0, 300));
          });
          const send = (method, params = {}) => new Promise((r) => { const i = ++id; pending.set(i, r); ws.send(JSON.stringify({ id: i, method, params })); });
          await send("Runtime.enable");
          const code = `(async () => {
            const log = [];
            const style = "https://tiles.openfreemap.org/styles/positron";
            for (const u of [style, location.origin + "/maplibre/maplibre-gl-worker.mjs", location.origin + "/maplibre/maplibre-gl-shared.mjs"]) {
              try { const r = await fetch(u); log.push("fetch " + u + " -> " + r.status + " " + r.headers.get("content-type")); }
              catch (e) { log.push("fetch " + u + " -> FAIL " + e); }
            }
            log.push("sw controller: " + !!(navigator.serviceWorker && navigator.serviceWorker.controller));
            try {
              const w = new Worker(location.origin + "/maplibre/maplibre-gl-worker.mjs", { type: "module" });
              await new Promise((res) => { w.onerror = (e) => { log.push("worker onerror: " + (e.message || "?")); res(); }; setTimeout(() => { log.push("worker: no error after 3s"); res(); }, 3000); });
              w.terminate();
            } catch (e) { log.push("worker ctor threw: " + e); }
            const ml = await import("${process.env.ML}");
            ml.setWorkerUrl(location.origin + "/maplibre/maplibre-gl-worker.mjs");
            const div = document.createElement("div");
            div.style.cssText = "position:fixed;inset:0;z-index:99999;background:#fff";
            document.body.appendChild(div);
            const map = new ml.Map({ container: div, style, center: [-74.076, 4.638], zoom: 15, attributionControl: false });
            map.on("error", (e) => log.push("map error: " + ((e.error && e.error.message) || "?")));
            await new Promise((res) => { map.once("load", () => { log.push("map load"); res(); }); setTimeout(() => { log.push("map: no load in 25s"); res(); }, 25000); });
            await new Promise((res) => { map.once("idle", () => { log.push("map idle"); res(); }); setTimeout(res, 15000); });
            return log;
          })()`;
          const res = await send("Runtime.evaluate", { expression: code, awaitPromise: true, returnByValue: true, timeout: 90000 });
          if (res.result?.exceptionDetails) console.log("EVAL EXCEPTION", JSON.stringify(res.result.exceptionDetails).slice(0, 800));
          for (const l of res.result?.result?.value ?? []) console.log("PROBE", l);
          const shot = await send("Page.captureScreenshot", { format: "png" });
          if (shot.result?.data) writeFileSync("probe.png", Buffer.from(shot.result.data, "base64"));
          ws.close();
          JS
          cat > emu.sh <<'SH'
          set -x
          adb install -r app.apk
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACTIVITY_RECOGNITION POST_NOTIFICATIONS; do adb shell pm grant com.rastro.app android.permission.$p || true; done
          adb shell am start -n com.rastro.app/.MainActivity
          sleep 25
          PID=$(adb shell pidof com.rastro.app | tr -d '\r')
          echo "PID=$PID"
          adb shell cat /proc/net/unix | grep -o 'webview_devtools_remote_[0-9]*' | sort -u
          adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
          curl -s http://127.0.0.1:9222/json/version || true
          adb shell dumpsys package com.google.android.webview | grep versionName | head -2
          timeout 180 node probe.mjs || echo "probe failed"
          adb logcat -d | grep -iE "chromium|console|maplibre|Capacitor" | tail -60
          SH
          chmod +x emu.sh
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: astro-vue-capacitor-2
          script: ./emu.sh
      - name: Commit screenshot
        if: always()
        run: |
          [ -f probe.png ] || exit 0
          mkdir -p ../map-previews && cp probe.png ../map-previews/emulator-probe.png
          cd .. && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-previews && git commit -m "chore: emulator probe screenshot (temporary)" && git push
