# Builds the Rastro Android APK.
#
# - Push a tag `vX.Y.Z` (scripts/release.sh does it) → signed release APK attached
#   to a GitHub Release, with notes generated from the commits since the last tag.
# - "Run workflow" by hand with a version (patch | minor | major | X.Y.Z) → same
#   release, the workflow creates the tag itself — no terminal needed.
# - "Run workflow" with the version empty → APK (debug or release) as a
#   downloadable artifact, nothing published.
#
# Release signing needs these repository secrets (see astro-vue-capacitor-2/docs/releases.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publicar release: patch | minor | major | X.Y.Z (vacío = solo build)"
        type: string
        default: ""
      build_type:
        description: "Tipo de APK (si no se publica)"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: astro-vue-capacitor-2

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Publish on a pushed tag, or on a manual run that names a version.
      IS_TAG: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (inputs.version || '') != '' }}
      BUILD_TYPE: ${{ ((github.event_name == 'push' && github.ref_type == 'tag') || (inputs.version || '') != '') && 'release' || inputs.build_type }}
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: versionCode is the commit count and release notes walk
          # back to the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-vue-capacitor-2/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # No setup-android: the runner image ships the SDK (ANDROID_HOME) with its
      # licenses accepted, and Gradle fetches any missing platform/build-tools.

      - name: Resolve version
        run: |
          if [ "$IS_TAG" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              # Same bump rules as scripts/release.sh (before any tag: from 2.0.0).
              LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v2.0.0)
              IFS=. read -r MAJ MIN PAT <<<"${LAST#v}"; PAT="${PAT%%-*}"
              case "$VERSION_INPUT" in
                patch) VERSION="$MAJ.$MIN.$((PAT + 1))" ;;
                minor) VERSION="$MAJ.$((MIN + 1)).0" ;;
                major) VERSION="$((MAJ + 1)).0.0" ;;
                *) VERSION="${VERSION_INPUT#v}" ;;
              esac
              if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                echo "::error::El tag v$VERSION ya existe"; exit 1
              fi
            fi
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::'$VERSION' no es X.Y.Z"; exit 1
            fi
            echo "Versión: $VERSION"
            echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
            echo "RASTRO_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
            echo "APK_NAME=rastro-v$VERSION.apk" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=rastro-$(git rev-parse --short HEAD)-$BUILD_TYPE.apk" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Load signing keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 — ver docs/releases.md"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RASTRO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          RASTRO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RASTRO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RASTRO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./android/gradlew -p android "$TASK" --no-daemon
          APK=$(find "android/app/build/outputs/apk/$BUILD_TYPE" -name '*.apk' | head -n1)
          [ -n "$APK" ] || { echo "::error::No se generó el APK"; exit 1; }
          mkdir -p out
          cp "$APK" "out/$APK_NAME"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          "$APKSIGNER" verify --print-certs "out/$APK_NAME"
          (cd out && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            astro-vue-capacitor-2/out/${{ env.APK_NAME }}
            astro-vue-capacitor-2/out/${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Release notes
        if: env.IS_TAG == 'true'
        run: |
          # HEAD is the release commit (the tag may not exist yet on a manual run).
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}HEAD"
          section() { # $1 title, $2 commit-type regex
            local lines
            lines=$(git log --no-merges --format='%s' "$RANGE" | grep -E "^($2)(\(.+\))?!?: " | sed -E 's/^[a-z]+(\(([^)]+)\))?!?: /- **\2** /; s/- \*\*\*\* /- /' || true)
            if [ -n "$lines" ]; then printf '### %s\n%s\n\n' "$1" "$lines"; fi
          }
          {
            section "Novedades" "feat"
            section "Arreglos" "fix"
            section "Rendimiento" "perf"
            section "Otros" "refactor|chore|docs|style|build|ci|test"
            if [ -n "$PREV" ]; then echo "**Cambios:** https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$RELEASE_TAG"; fi
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "out/$APK_NAME.sha256")\`"
          } > out/NOTES.md
          cat out/NOTES.md

      - uses: softprops/action-gh-release@v2
        if: env.IS_TAG == 'true'
        with:
          # On a manual run this also creates the tag at the built commit.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Rastro ${{ env.RELEASE_TAG }}
          body_path: astro-vue-capacitor-2/out/NOTES.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            astro-vue-capacitor-2/out/${{ env.APK_NAME }}
            astro-vue-capacitor-2/out/${{ env.APK_NAME }}.sha256
